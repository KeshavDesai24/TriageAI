version: "3.8"

services:
  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    networks:
      - triage-network

  backend:
    build: ./backend    
    ports:
      - "8000:8000"
    networks:
      - triage-network

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    networks:
      - triage-network

networks:
  triage-network:
    driver: bridge